name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || npx pod-install ios

      - name: Build iOS Application (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          
          # Detect main app scheme from project (avoiding Pods schemes)
          SCHEME=$(xcodebuild -project "$PROJECT" -list | awk '/Schemes:/{flag=1;next}/^[[:space:]]*$/{flag=0}flag{print; exit}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          SCHEME=${SCHEME:-ExpoGoTestApp}
          
          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJECT"
          echo "Building Scheme: '$SCHEME' for iOS device..."
          
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "../build/DerivedData" \
            build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee ../xcodebuild.log || {
              echo "==================== XCODEBUILD FAILED ===================="
              grep -E "(error:|fatal error:)" ../xcodebuild.log || tail -n 80 ../xcodebuild.log
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -q ExpoGoTestApp.ipa Payload
          echo "IPA created successfully at build/ExpoGoTestApp.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpoGoTestApp-Sideloadly-IPA
          path: build/ExpoGoTestApp.ipa
          retention-days: 7
