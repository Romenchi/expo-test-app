name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-14
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure System Node Symlink
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install dependencies
        run: npm ci || npm install

      - name: Patch ExpoModulesJSI for Xcode 16 compatibility
        run: |
          sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/' node_modules/expo-modules-jsi/apple/Package.swift || true
          sed -i '' 's/-disableAutomaticPackageResolution//' node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true
          echo "Patched Package.swift:"
          head -n 2 node_modules/expo-modules-jsi/apple/Package.swift

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Configure Xcode Environment
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || npx pod-install ios

      - name: Build iOS Application (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="ExpoGoTestApp"
          
          echo "Workspace: $WORKSPACE"
          echo "Building Scheme: '$SCHEME' for iOS device..."
          
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "../build/DerivedData" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee ../xcodebuild.log || {
              echo "### ❌ Xcodebuild Build Failure Details" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E -C 2 -i "(error:|fatal:)" ../xcodebuild.log | head -n 40 >> $GITHUB_STEP_SUMMARY || tail -n 40 ../xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -q ExpoGoTestApp.ipa Payload
          echo "IPA created successfully at build/ExpoGoTestApp.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpoGoTestApp-Sideloadly-IPA
          path: build/ExpoGoTestApp.ipa
          retention-days: 7

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log
          retention-days: 3
