name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode & Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure System Node Symlink
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node

      - name: Install dependencies
        run: npm ci || npm install

      - name: Patch ExpoModulesJSI for C++ bridging compatibility
        run: |
          python3 -c "
          h_path = 'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h'
          with open(h_path, 'r', encoding='utf-8') as f:
              h = f.read()
          h = h.replace('#include <swift/bridging>', '#include <swift/bridging>\n#ifndef SWIFT_RETURNS_RETAINED\n#define SWIFT_RETURNS_RETAINED\n#endif')
          with open(h_path, 'w', encoding='utf-8') as f:
              f.write(h)
          "
          sed -i '' 's/-disableAutomaticPackageResolution//' node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true
          echo "Applied RuntimeScheduler.h bridging patch"

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Configure Xcode Environment
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update || npx pod-install ios

      - name: Archive iOS Application (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="ExpoGoTestApp"
          
          echo "Workspace: $WORKSPACE"
          echo "Archiving Scheme: '$SCHEME' for iOS device..."
          
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "../build/ExpoGoTestApp.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee ../xcodebuild.log

      - name: Save Error Log to Repo on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          grep -E -C 3 -i "(error:|fatal error:)" xcodebuild.log > build-error.txt || tail -n 120 xcodebuild.log > build-error.txt
          git add build-error.txt
          git commit -m "Add build-error.txt from failed run [skip ci]" || true
          git push || true

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ExpoGoTestApp.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r -q ExpoGoTestApp.ipa Payload
          echo "IPA created successfully at build/ExpoGoTestApp.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpoGoTestApp-Sideloadly-IPA
          path: build/ExpoGoTestApp.ipa
          retention-days: 7
